services:
  - type: web
    name: zurfaelac-api
    runtime: node
    plan: free
    rootDir: /
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_NAME
        value: Zurfael AC
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: CONTACT_RECIPIENT_EMAIL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: zurfaelac
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASS
        sync: false
